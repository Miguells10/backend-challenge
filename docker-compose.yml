services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: ${PENDING_REFERENCE_INITIAL_DELAY_MS:-5000}
      PENDING_REFERENCE_MAX_DELAY_MS: ${PENDING_REFERENCE_MAX_DELAY_MS:-300000}
      PENDING_REFERENCE_MAX_ATTEMPTS: ${PENDING_REFERENCE_MAX_ATTEMPTS:-5}
      PENDING_REFERENCE_BATCH_SIZE: ${PENDING_REFERENCE_BATCH_SIZE:-10}
      PENDING_REFERENCE_POLL_INTERVAL_MS: ${PENDING_REFERENCE_POLL_INTERVAL_MS:-1000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build: .
    command: bun run start:worker
    profiles: ["worker"]
    environment:
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: ${PENDING_REFERENCE_INITIAL_DELAY_MS:-5000}
      PENDING_REFERENCE_MAX_DELAY_MS: ${PENDING_REFERENCE_MAX_DELAY_MS:-300000}
      PENDING_REFERENCE_MAX_ATTEMPTS: ${PENDING_REFERENCE_MAX_ATTEMPTS:-5}
      PENDING_REFERENCE_BATCH_SIZE: ${PENDING_REFERENCE_BATCH_SIZE:-10}
      PENDING_REFERENCE_POLL_INTERVAL_MS: ${PENDING_REFERENCE_POLL_INTERVAL_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  publisher:
    build: .
    command: bun run start:publisher
    profiles: ["publisher"]
    environment:
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: ${PENDING_REFERENCE_INITIAL_DELAY_MS:-5000}
      PENDING_REFERENCE_MAX_DELAY_MS: ${PENDING_REFERENCE_MAX_DELAY_MS:-300000}
      PENDING_REFERENCE_MAX_ATTEMPTS: ${PENDING_REFERENCE_MAX_ATTEMPTS:-5}
      PENDING_REFERENCE_BATCH_SIZE: ${PENDING_REFERENCE_BATCH_SIZE:-10}
      PENDING_REFERENCE_POLL_INTERVAL_MS: ${PENDING_REFERENCE_POLL_INTERVAL_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  reference-reprocessor:
    build: .
    command: bun run start:reference-reprocessor
    profiles: ["reference-reprocessor"]
    environment:
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: ${PENDING_REFERENCE_INITIAL_DELAY_MS:-5000}
      PENDING_REFERENCE_MAX_DELAY_MS: ${PENDING_REFERENCE_MAX_DELAY_MS:-300000}
      PENDING_REFERENCE_MAX_ATTEMPTS: ${PENDING_REFERENCE_MAX_ATTEMPTS:-5}
      PENDING_REFERENCE_BATCH_SIZE: ${PENDING_REFERENCE_BATCH_SIZE:-10}
      PENDING_REFERENCE_POLL_INTERVAL_MS: ${PENDING_REFERENCE_POLL_INTERVAL_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
