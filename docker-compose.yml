services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test", "distributed-test"]
    environment:
      POSTGRES_DB: wagering_test
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      SERVICE_NAME: api
      PORT: 3000
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: ${PENDING_REFERENCE_INITIAL_DELAY_MS:-5000}
      PENDING_REFERENCE_MAX_DELAY_MS: ${PENDING_REFERENCE_MAX_DELAY_MS:-300000}
      PENDING_REFERENCE_MAX_ATTEMPTS: ${PENDING_REFERENCE_MAX_ATTEMPTS:-5}
      PENDING_REFERENCE_BATCH_SIZE: ${PENDING_REFERENCE_BATCH_SIZE:-10}
      PENDING_REFERENCE_POLL_INTERVAL_MS: ${PENDING_REFERENCE_POLL_INTERVAL_MS:-1000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build: .
    command: bun run start:worker
    profiles: ["worker"]
    environment:
      SERVICE_NAME: worker
      METRICS_PORT: 9464
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: ${PENDING_REFERENCE_INITIAL_DELAY_MS:-5000}
      PENDING_REFERENCE_MAX_DELAY_MS: ${PENDING_REFERENCE_MAX_DELAY_MS:-300000}
      PENDING_REFERENCE_MAX_ATTEMPTS: ${PENDING_REFERENCE_MAX_ATTEMPTS:-5}
      PENDING_REFERENCE_BATCH_SIZE: ${PENDING_REFERENCE_BATCH_SIZE:-10}
      PENDING_REFERENCE_POLL_INTERVAL_MS: ${PENDING_REFERENCE_POLL_INTERVAL_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker-test:
    build: .
    command: bun run start:worker
    profiles: ["distributed-test"]
    deploy:
      replicas: 3
    environment:
      SERVICE_NAME: worker-test
      METRICS_PORT: 9464
      DATABASE_URL: postgresql://wagering:wagering@postgres-test:5432/wagering_test
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions-test.fifo
      WAGER_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-test-dlq.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events-test.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: 5000
      PENDING_REFERENCE_MAX_DELAY_MS: 300000
      PENDING_REFERENCE_MAX_ATTEMPTS: 5
      PENDING_REFERENCE_BATCH_SIZE: 10
      PENDING_REFERENCE_POLL_INTERVAL_MS: 1000
    depends_on:
      postgres-test:
        condition: service_healthy
      localstack:
        condition: service_healthy

  distributed-test-runner:
    build: .
    command: sh -c "bun run migration:up && bun run test:distributed-workers:run"
    profiles: ["distributed-test"]
    environment:
      SERVICE_NAME: distributed-test-runner
      RUN_INTEGRATION_TESTS: "true"
      RUN_DISTRIBUTED_WORKER_TESTS: "true"
      DATABASE_URL: postgresql://wagering:wagering@postgres-test:5432/wagering_test
      TEST_DATABASE_URL: postgresql://wagering:wagering@postgres-test:5432/wagering_test
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions-test.fifo
      WAGER_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-test-dlq.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events-test.fifo
      TEST_WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions-test.fifo
      TEST_WAGER_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-test-dlq.fifo
      TEST_WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events-test.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: 5000
      PENDING_REFERENCE_MAX_DELAY_MS: 300000
      PENDING_REFERENCE_MAX_ATTEMPTS: 5
      PENDING_REFERENCE_BATCH_SIZE: 10
      PENDING_REFERENCE_POLL_INTERVAL_MS: 1000
    depends_on:
      postgres-test:
        condition: service_healthy
      localstack:
        condition: service_healthy
      worker-test:
        condition: service_started

  publisher:
    build: .
    command: bun run start:publisher
    profiles: ["publisher"]
    environment:
      SERVICE_NAME: publisher
      METRICS_PORT: 9464
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: ${PENDING_REFERENCE_INITIAL_DELAY_MS:-5000}
      PENDING_REFERENCE_MAX_DELAY_MS: ${PENDING_REFERENCE_MAX_DELAY_MS:-300000}
      PENDING_REFERENCE_MAX_ATTEMPTS: ${PENDING_REFERENCE_MAX_ATTEMPTS:-5}
      PENDING_REFERENCE_BATCH_SIZE: ${PENDING_REFERENCE_BATCH_SIZE:-10}
      PENDING_REFERENCE_POLL_INTERVAL_MS: ${PENDING_REFERENCE_POLL_INTERVAL_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  reference-reprocessor:
    build: .
    command: bun run start:reference-reprocessor
    profiles: ["reference-reprocessor"]
    environment:
      SERVICE_NAME: reference-reprocessor
      METRICS_PORT: 9464
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      WAGER_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      PENDING_REFERENCE_INITIAL_DELAY_MS: ${PENDING_REFERENCE_INITIAL_DELAY_MS:-5000}
      PENDING_REFERENCE_MAX_DELAY_MS: ${PENDING_REFERENCE_MAX_DELAY_MS:-300000}
      PENDING_REFERENCE_MAX_ATTEMPTS: ${PENDING_REFERENCE_MAX_ATTEMPTS:-5}
      PENDING_REFERENCE_BATCH_SIZE: ${PENDING_REFERENCE_BATCH_SIZE:-10}
      PENDING_REFERENCE_POLL_INTERVAL_MS: ${PENDING_REFERENCE_POLL_INTERVAL_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
